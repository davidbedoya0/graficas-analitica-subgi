<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Múltiples Gráficos Apilados con Paleta Personalizada y Leyenda Interactiva</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <style>
        #charts-container {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: flex-start;
            width: 100%;
            transition: all 0.3s ease;
        }
        .chart-container {
            flex: 1;
            min-width: 200px;
            height: 400px;
            margin: 5px;
            border: 1px solid #ccc;
            transition: all 0.3s ease;
        }
        /* Estilos para vista individual */
        #charts-container.single-view {
            justify-content: center;
        }
        #charts-container.single-view .chart-container {
            flex: none;
            width: 400px;
            height: 400px;
        }
        /* Estilos para vista de dos gráficos */
        #charts-container.two-view {
            justify-content: center;
            gap: 20px;
        }
        #charts-container.two-view .chart-container {
            flex: none;
            width: 350px;
            height: 400px;
        }
        #legend-general {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-top: 24px;
            gap: 18px;
            font-family: Arial, sans-serif;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 3px 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            margin-right: 8px;
            border: 1px solid #999;
            display: inline-block;
        }
        /* Estado "oculto" en la leyenda */
        .legend-item.inactive .legend-color {
            opacity: 0.3;
        }
        .legend-item.inactive {
            opacity: 0.6;
        }
        /* Estilos para botones de escenarios */
        .btn-scenario {
            all: unset;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: 500;
            font-family: inherit;
        }
        .btn-scenario.active {
            background: #111827;
            color: #fff;
        }
        .btn-scenario:not(.active) {
            background: #f3f4f6;
            color: #111;
        }
    </style>
</head>
<body>

    <div id="global-title" style="text-align:center; margin-top:24px; font-family:Arial,sans-serif;">
        <h2 style="margin-bottom:4px;">Escenarios de capacidad instalada por tecnología</h2>
        <div style="font-size:0.8em; color:#555; text-align:left; margin-left:8px;">
            Fuente: Minenergía - Hoja de Ruta TEJ
        </div>
    </div>

    <div id="charts-container">
        <div id="chart1" class="chart-container"></div>
        <div id="chart2" class="chart-container"></div>
        <div id="chart3" class="chart-container"></div>
        <div id="chart4" class="chart-container"></div>
        <div id="chart5" class="chart-container"></div>
    </div>

    <div id="legend-general">
        <div class="legend-item"><span class="legend-color" style="background:#5fa1d7"></span>Hidro</div>
        <div class="legend-item"><span class="legend-color" style="background:#a6d7f3"></span>Hidro peq.</div>
        <div class="legend-item"><span class="legend-color" style="background:#b0d448"></span>Gas</div>
        <div class="legend-item"><span class="legend-color" style="background:#e5e668"></span>Solar</div>
        <div class="legend-item"><span class="legend-color" style="background:#f7c873"></span>Solar distribuida</div>
        <div class="legend-item"><span class="legend-color" style="background:#d7e1ba"></span>Solar + almacenamiento</div>
        <div class="legend-item"><span class="legend-color" style="background:#4a5552"></span>Carbón</div>
        <div class="legend-item"><span class="legend-color" style="background:#4B0082"></span>Eólica onshore</div>
        <div class="legend-item"><span class="legend-color" style="background:#41b7e9"></span>Eólica offshore</div>
        <div class="legend-item"><span class="legend-color" style="background:#8077b8"></span>Geotérmica</div>
        <div class="legend-item"><span class="legend-color" style="background:#6eb06c"></span>Bioenergía</div>
        <div class="legend-item"><span class="legend-color" style="background:#71004b"></span>Nuclear</div>
    </div>

    <div id="bottom-controls" style="max-width: 1100px; margin: 20px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr; gap: 12px;">
        <div id="controls-row" style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;">
            <div id="segmented-buttons" style="display: inline-flex; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; width: fit-content;">
                <button id="btnTodos" class="btn-scenario active" aria-pressed="true">Todos</button>
                <button id="btnTendencial" class="btn-scenario" aria-pressed="false">Tendencial</button>
                <button id="btnMedidas" class="btn-scenario" aria-pressed="false">Medidas</button>
                <button id="btnTEJ" class="btn-scenario" aria-pressed="false">TEJ</button>
                <button id="btnPENSup" class="btn-scenario" aria-pressed="false">PEN L.Sup</button>
                <button id="btnPENInf" class="btn-scenario" aria-pressed="false">PEN L.Inf</button>
            </div>
            <div id="inline-metrics" style="display: inline-flex; align-items: center; gap: 10px; margin-left: 0; font-size: .95rem;">
                <label for="yearSelect">Año:</label>
                <select id="yearSelect" style="padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 8px; font-size: .9rem;">
                    <option value="0">2030</option>
                    <option value="1">2040</option>
                    <option value="2">2050</option>
                </select>
                <span style="color: #374151;">Total:</span>
                <span id="totalValue" style="font-weight: 700;">— GW</span>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const charts = [];
        const categories = ['2030', '2040', '2050'];

        // 1. Tendencial
        const seriesTendencial = [
            { name: 'Hidro', data: [13.6, 13.6, 13.6], color: '#5fa1d7' },
            { name: 'Hidro peq.', data: [1.2, 1.3, 1.3], color: '#a6d7f3' },
            { name: 'Gas', data: [23.7, 5.4, 5.4], color: '#b0d448' },
            { name: 'Solar', data: [15.0, 15.1, 15.1], color: '#e5e668' },
            { name: 'Solar distribuida', data: [0.7, 1.3, 1.8], color: '#f7c873' },
            { name: 'Solar + almacenamiento', data: [0.0, 0.0, 0.0], color: '#d7e1ba' },
            { name: 'Carbón', data: [1.7, 0.0, 0.0], color: '#4a5552' },
            { name: 'Eólica onshore', data: [3.0, 3.0, 3.0], color: '#4B0082' },
            { name: 'Eólica offshore', data: [0.0, 1.5, 1.5], color: '#41b7e9' },
            { name: 'Geotérmica', data: [0.0, 0.0, 0.0], color: '#8077b8' },
            { name: 'Bioenergía', data: [0.2, 0.2, 0.2], color: '#6eb06c' },
            { name: 'Nuclear', data: [0.0, 0.0, 0.0], color: '#71004b' }
        ];

        // 2. Medidas en Implementación
        const seriesMedidas = [
            { name: 'Hidro', data: [13.6, 13.6, 13.6], color: '#5fa1d7' },
            { name: 'Hidro peq.', data: [1.2, 1.3, 1.3], color: '#a6d7f3' },
            { name: 'Gas', data: [3.7, 6.4, 6.4], color: '#b0d448' },
            { name: 'Solar', data: [15.0, 15.1, 15.1], color: '#e5e668' },
            { name: 'Solar distribuida', data: [0.7, 1.3, 1.8], color: '#f7c873' },
            { name: 'Solar + almacenamiento', data: [0.0, 0.0, 0.0], color: '#d7e1ba' },
            { name: 'Carbón', data: [1.7, 0.0, 0.0], color: '#4a5552' },
            { name: 'Eólica onshore', data: [3.0, 3.0, 3.0], color: '#4B0082' },
            { name: 'Eólica offshore', data: [0.0, 4.5, 4.5], color: '#41b7e9' },
            { name: 'Geotérmica', data: [0.0, 0.1, 0.1], color: '#8077b8' },
            { name: 'Bioenergía', data: [0.2, 0.2, 0.2], color: '#6eb06c' },
            { name: 'Nuclear', data: [0.0, 0.0, 0.0], color: '#71004b' }
        ];

        // 3. TEJ
        const seriesTEJ = [
            { name: 'Hidro', data: [13.6, 13.6, 13.6], color: '#5fa1d7' },
            { name: 'Hidro peq.', data: [1.2, 3.0, 6.0], color: '#a6d7f3' },
            { name: 'Gas', data: [3.8, 3.8, 3.8], color: '#b0d448' },
            { name: 'Solar', data: [15.2, 18.2, 25.0], color: '#e5e668' },
            { name: 'Solar distribuida', data: [3.2, 7.2, 11.8], color: '#f7c873' },
            { name: 'Solar + almacenamiento', data: [1.0, 1.7, 6.8], color: '#d7e1ba' },
            { name: 'Carbón', data: [0.7, 0.0, 0.0], color: '#4a5552' },
            { name: 'Eólica onshore', data: [3.0, 3.0, 7.0], color: '#4B0082' },
            { name: 'Eólica offshore', data: [0.0, 7.0, 8.4], color: '#41b7e9' },
            { name: 'Geotérmica', data: [0.0, 0.4, 1.2], color: '#8077b8' },
            { name: 'Bioenergía', data: [0.7, 3.2, 5.5], color: '#6eb06c' },
            { name: 'Nuclear', data: [0.0, 0.0, 0.0], color: '#71004b' }
        ];

        // 4. TE PEN L. Superior
        const seriesPENSuperior = [
            { name: 'Hidro', data: [13.5, 13.9, 16.8], color: '#5fa1d7' },
            { name: 'Hidro peq.', data: [1.2, 1.2, 1.5], color: '#a6d7f3' },
            { name: 'Gas', data: [4.4, 5.0, 5.0], color: '#b0d448' },
            { name: 'Solar', data: [13.4, 16.6, 20.1], color: '#e5e668' },
            { name: 'Solar distribuida', data: [1.0, 1.7, 2.1], color: '#f7c873' },
            { name: 'Solar + almacenamiento', data: [0.0, 0.0, 0.0], color: '#d7e1ba' },
            { name: 'Carbón', data: [1.6, 1.2, 1.0], color: '#4a5552' },
            { name: 'Eólica onshore', data: [3.2, 7.9, 27.8], color: '#4B0082' },
            { name: 'Eólica offshore', data: [1.0, 3.5, 9.0], color: '#41b7e9' },
            { name: 'Geotérmica', data: [0.0, 0.4, 0.7], color: '#8077b8' },
            { name: 'Bioenergía', data: [0.0, 0.0, 0.0], color: '#6eb06c' },
            { name: 'Nuclear', data: [0.0, 0.6, 1.2], color: '#71004b' }
        ];

        // 5. TE PEN L. Inferior
        const seriesPENInferior = [
            { name: 'Hidro', data: [13.5, 15.5, 24.9], color: '#5fa1d7' },
            { name: 'Hidro peq.', data: [1.2, 1.4, 2.2], color: '#a6d7f3' },
            { name: 'Gas', data: [4.4, 5.0, 5.0], color: '#b0d448' },
            { name: 'Solar', data: [13.4, 18.6, 29.5], color: '#e5e668' },
            { name: 'Solar distribuida', data: [1.0, 1.7, 2.5], color: '#f7c873' },
            { name: 'Solar + almacenamiento', data: [0.0, 0.0, 0.0], color: '#d7e1ba' },
            { name: 'Carbón', data: [1.6, 1.2, 1.0], color: '#4a5552' },
            { name: 'Eólica onshore', data: [3.2, 14.1, 30.0], color: '#4B0082' },
            { name: 'Eólica offshore', data: [1.0, 3.5, 14.0], color: '#41b7e9' },
            { name: 'Geotérmica', data: [0.0, 0.4, 0.7], color: '#8077b8' },
            { name: 'Bioenergía', data: [0.0, 0.0, 0.0], color: '#6eb06c' },
            { name: 'Nuclear', data: [0.0, 0.6, 1.8], color: '#71004b' }
        ];

        // Función para crear y almacenar cada gráfico
        function crearGrafico(container, titulo, series) {
            const chart = Highcharts.chart(container, {
                chart: { type: 'column', backgroundColor: '#ffffff' },
                title: { text: titulo },
                xAxis: { categories: categories },
                yAxis: {
                    min: 0,  
                    max: 120,
                    title: { text: 'GW' },
                    tickInterval: 20
                },
                plotOptions: {
                    column: { stacking: 'normal' }
                },
                legend: { enabled: false },
                series: series
            });
            charts.push(chart);
        }

        // Crear los 5 escenarios
        crearGrafico('chart1', 'Tendencial', seriesTendencial);
        crearGrafico('chart2', 'Medidas en Implementación', seriesMedidas);
        crearGrafico('chart3', 'TEJ', seriesTEJ);
        crearGrafico('chart4', 'TE PEN L. Sup.', seriesPENSuperior);
        crearGrafico('chart5', 'TE PEN L. Inf.', seriesPENInferior);

        // Interactividad: click en leyenda general
        document.querySelectorAll('#legend-general .legend-item').forEach(item => {
            item.addEventListener('click', function() {
                const name = this.textContent.trim();
                // Alternar clase "inactive" y visibilidad
                const visible = !this.classList.toggle('inactive');
                charts.forEach(chart => {
                    const serie = chart.series.find(s => s.name === name);
                    if (serie) serie.setVisible(visible, false);
                });
                // Redibujar todos
                charts.forEach(c => c.redraw());
            });
        });

        // ===== NUEVA FUNCIONALIDAD: Control de escenarios y totales =====
        
        // Mapeo de datos por escenario
        const scenarioData = {
            'Tendencial': seriesTendencial,
            'Medidas': seriesMedidas, 
            'TEJ': seriesTEJ,
            'PENSup': seriesPENSuperior,
            'PENInf': seriesPENInferior
        };

        // Variables de estado
        let currentView = 'Todos';
        let currentScenario = 'Tendencial';
        let selectedScenarios = ['Tendencial', 'Medidas', 'TEJ', 'PENSup', 'PENInf']; // Para multi-selección

        // Función para calcular totales
        function calculateTotal(scenario, yearIndex) {
            let total = 0;
            scenarioData[scenario].forEach(series => {
                total += series.data[yearIndex] || 0;
            });
            return total;
        }

        // Función para cambiar vista
        function switchView(viewName) {
            const chartsContainer = document.getElementById('charts-container');
            const chartDivs = chartsContainer.querySelectorAll('.chart-container');
            const scenarios = ['Tendencial', 'Medidas', 'TEJ', 'PENSup', 'PENInf'];
            
            if (viewName === 'Todos') {
                // Modo Todos: mostrar todos y permitir multi-selección
                currentView = 'Todos';
                selectedScenarios = [...scenarios]; // Todos seleccionados
                currentScenario = 'Tendencial';
                
                // Actualizar botones - solo Todos activo, otros como seleccionables
                document.querySelectorAll('.btn-scenario').forEach(btn => {
                    btn.classList.remove('active');
                    btn.setAttribute('aria-pressed', 'false');
                });
                document.getElementById('btnTodos').classList.add('active');
                document.getElementById('btnTodos').setAttribute('aria-pressed', 'true');
                
                // Mostrar todos los gráficos con tamaño normal
                chartDivs.forEach(div => div.style.display = 'block');
                chartsContainer.classList.remove('single-view');
                chartsContainer.style.flexDirection = 'row';
                
            } else if (currentView === 'Todos') {
                // Transición de Todos a individual: mostrar solo uno, tamaño grande
                currentView = 'Individual';
                selectedScenarios = [viewName];
                currentScenario = viewName;
                
                // Actualizar botones
                document.querySelectorAll('.btn-scenario').forEach(btn => {
                    btn.classList.remove('active');
                    btn.setAttribute('aria-pressed', 'false');
                });
                document.getElementById(`btn${viewName}`).classList.add('active');
                document.getElementById(`btn${viewName}`).setAttribute('aria-pressed', 'true');
                
                // Mostrar solo un gráfico con tamaño grande
                chartDivs.forEach((div, index) => {
                    div.style.display = scenarios[index] === viewName ? 'block' : 'none';
                });
                chartsContainer.classList.add('single-view');
                
            } else {
                // Modo multi-selección: toggle individual scenarios
                const scenarioIndex = scenarios.indexOf(viewName);
                const isCurrentlySelected = selectedScenarios.includes(viewName);
                
                if (isCurrentlySelected && selectedScenarios.length > 1) {
                    // Deseleccionar si hay más de uno seleccionado
                    selectedScenarios = selectedScenarios.filter(s => s !== viewName);
                    document.getElementById(`btn${viewName}`).classList.remove('active');
                    document.getElementById(`btn${viewName}`).setAttribute('aria-pressed', 'false');
                    chartDivs[scenarioIndex].style.display = 'none';
                } else if (!isCurrentlySelected) {
                    // Seleccionar escenario adicional
                    selectedScenarios.push(viewName);
                    document.getElementById(`btn${viewName}`).classList.add('active');
                    document.getElementById(`btn${viewName}`).setAttribute('aria-pressed', 'true');
                    chartDivs[scenarioIndex].style.display = 'block';
                }
                
                // Ajustar layout según número de gráficos visibles
                const visibleCount = selectedScenarios.length;
                if (visibleCount === 1) {
                    chartsContainer.classList.remove('two-view');
                    chartsContainer.classList.add('single-view');
                    currentScenario = selectedScenarios[0];
                } else if (visibleCount === 2) {
                    chartsContainer.classList.remove('single-view');
                    chartsContainer.classList.add('two-view');
                    chartsContainer.style.flexDirection = 'row';
                    currentScenario = selectedScenarios[0]; // Usar el primero para totales
                } else {
                    chartsContainer.classList.remove('single-view', 'two-view');
                    chartsContainer.style.flexDirection = 'row';
                    currentScenario = selectedScenarios[0]; // Usar el primero para totales
                }
            }

            // Actualizar totales
            updateTotals();
        }

        // Función para actualizar totales
        function updateTotals() {
            const yearIndex = parseInt(document.getElementById('yearSelect').value, 10);
            const total = calculateTotal(currentScenario, yearIndex);
            const fmt = new Intl.NumberFormat('es-CO', { maximumFractionDigits: 1 });
            document.getElementById('totalValue').textContent = `${fmt.format(total)} GW`;
        }

        // Event listeners para botones
        document.getElementById('btnTodos').addEventListener('click', () => switchView('Todos'));
        document.getElementById('btnTendencial').addEventListener('click', () => switchView('Tendencial'));
        document.getElementById('btnMedidas').addEventListener('click', () => switchView('Medidas'));
        document.getElementById('btnTEJ').addEventListener('click', () => switchView('TEJ'));
        document.getElementById('btnPENSup').addEventListener('click', () => switchView('PENSup'));
        document.getElementById('btnPENInf').addEventListener('click', () => switchView('PENInf'));

        // Event listener para selector de año
        document.getElementById('yearSelect').addEventListener('change', updateTotals);

        // Inicializar totales
        updateTotals();

    });
    </script>
</body>
</html>
