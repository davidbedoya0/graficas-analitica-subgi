<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Consumo final mundial por sector y escenario: 2023 - 2050 (EJ)</title>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/modules/exporting.js"></script>
  <script src="https://code.highcharts.com/modules/accessibility.js"></script>
  <script src="https://code.highcharts.com/modules/export-data.js"></script>
  <script src="https://code.highcharts.com/modules/accessibility.js"></script>
  <style>
    body{margin:0;font-family:"Segoe UI", Roboto, system-ui, -apple-system, sans-serif;background:#fff;}
    #wrap{max-width:1100px;margin:20px auto;padding:0 12px;}
    h1{margin:0 0 2px 0;text-align:center;font-size:20px;font-weight:700}
    .subtitle{margin:0 0 14px 0;text-align:center;font-size:13px;color:#555;font-weight:400}
    #grid{display:grid;grid-template-columns: repeat(3, 1fr); gap:10px;}
    .chart{height:430px;min-width:260px;}
    #global-legend{
      display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
      margin:10px auto 0 auto;max-width:980px
    }
    #global-legend .legend-item{
      display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
      font-size:12px;padding:0 6px;border:none;background:transparent;border-radius:0;
      transition:opacity .12s ease;
    }
    #global-legend .legend-item.off{ opacity:.35; }
    #global-legend .legend-item .swatch{
      width:16px;height:10px;border-radius:2px;border:none;background: var(--c);
    }
    @media (max-width: 980px){
      #grid{grid-template-columns:1fr;}
      .chart{height:420px;}
    }
  </style>
</head>
<body>
<div id="wrap">
  <h1>Consumo final global por sector y escenario</h1>
  <div class="subtitle">Fuente: adaptado de base de datos (IEA, 2024)</div>

  <div id="grid">
    <div id="c-steps" class="chart"></div>
    <div id="c-aps"   class="chart"></div>
    <div id="c-nze"   class="chart"></div>
  </div>

  <div id="global-legend" aria-label="Leyenda global por sector"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // ===== Paleta UPME =====
  const PALETTE = {
    green:  '#0a8c00',  // Transporte
    teal:   '#183e34',  // Industria
    wasabi: '#b8f600',  // Residencial
    gold:   '#ecb000',  // Servicios
    neon:   '#05d80a'   // Electricidad
  };

  Highcharts.setOptions({ lang: { decimalPoint: ',', thousandsSep: '.' } });

  // Eje X común
  const YEARS = [2023, 2030, 2035, 2050];

  // ===== Datos (EJ) =====
  const DATA = {
    STEPS: {
      'Transporte':   [121.974, 131.675, 132.552, 139.866],
      'Industria':    [172.779, 193.073, 199.710, 209.481],
      'Residencial':  [ 85.516,  87.147,  88.246,  95.600],
      'Servicios':    [ 38.596,  45.342,  48.471,  57.044],
      'Electricidad': [ 90.671, 113.721, 128.638, 168.077]
    },
    APS: {
      'Transporte':   [121.974, 125.210, 120.781, 109.140],
      'Industria':    [172.779, 185.150, 184.632, 176.867],
      'Residencial':  [ 85.516,  76.993,  73.595,  75.720],
      'Servicios':    [ 38.596,  43.054,  43.643,  47.205],
      'Electricidad': [ 90.671, 114.965, 132.047, 184.087]
    },
    NZE: {
      'Transporte':   [121.974, 108.522,  90.845,  76.192],
      'Industria':    [172.779, 178.188, 173.476, 156.705],
      'Residencial':  [ 85.516,  65.278,  58.190,  56.504],
      'Servicios':    [ 38.596,  37.269,  35.838,  35.521],
      'Electricidad': [ 90.671, 116.201, 136.296, 187.647]
    }
  };

  // Colores por serie
  const COLOR = {
    'Transporte':   PALETTE.green,
    'Industria':    PALETTE.teal,
    'Residencial':  PALETTE.wasabi,
    'Servicios':    PALETTE.gold,
    'Electricidad': PALETTE.neon
  };

  // ===== Escala común del eje Y (igual para los 3) =====
  const COMMON_Y_AXIS = {
    min: 0,
    max: 700,                           // tope común (ajústalo si quieres)
    tickPositions: [0,100,200,300,400,500,600,700],
    startOnTick: true,
    endOnTick: true,
    gridLineColor: '#e6e6e6',
    reversedStacks: false,
    labels: { format: '{value:,.0f}' }
  };

  // Utilidad: objeto → series Highcharts apiladas
  function buildSeries(obj){
    return Object.keys(obj).map(name => ({
      type: 'areaspline',
      name,
      data: YEARS.map((x,i) => [x, obj[name][i]]),
      color: COLOR[name],
      lineColor: COLOR[name],
      fillOpacity: 0.9,
      marker: { enabled: false },
      showInLegend: false,
      tooltip: { valueDecimals: 1 }
    }));
  }

  // Creador de cada gráfico
  function makeChart(renderTo, titleText, dataObj, showYAxisTitle){
    return Highcharts.chart(renderTo, {
      chart: { spacing: [6,6,6,6] },
      title: { text: titleText, align: 'center', style: { fontSize: '14px', fontWeight: 700 } },
      credits: { enabled: false },
      legend: { enabled: false }, // leyenda externa global
      xAxis: {
        tickPositions: YEARS,
        startOnTick: true, endOnTick: true,
        tickmarkPlacement: 'on',
        labels: { formatter(){ return this.value; } }
      },
      yAxis: {
        ...COMMON_Y_AXIS,                                 // << ESCALA COMÚN
        title: { text: showYAxisTitle ? 'EJ' : null }     // solo en STEPS
      },
      tooltip: { shared: true, valueSuffix: ' EJ' },
      plotOptions: { series: { stacking: 'normal' } },
      exporting: { enabled: true },
      series: buildSeries(dataObj)
    });
  }

  // Render (solo STEPS muestra “EJ”)
  const chSteps = makeChart('c-steps', 'STEPS', DATA.STEPS, true);
  const chAPS   = makeChart('c-aps',   'APS',   DATA.APS,   false);
  const chNZE   = makeChart('c-nze',   'NZE',   DATA.NZE,   false);

  // ===== Leyenda global (en español) =====
  function buildGlobalLegend(containerId, charts) {
    const order = ['Transporte','Industria','Residencial','Servicios','Electricidad'];
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    order.forEach(name => {
      const div = document.createElement('div');
      div.className = 'legend-item';
      div.setAttribute('role','button');
      div.setAttribute('aria-label', name);

      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.setProperty('--c', COLOR[name]);
      div.appendChild(sw);

      const label = document.createElement('span');
      label.textContent = name;
      div.appendChild(label);

      // Toggle visibilidad en los tres charts
      div.addEventListener('click', () => {
        let targetVisible = null;
        charts.forEach(ch => {
          const s = ch.series.find(sr => sr.name === name);
          if (s) { if (targetVisible === null) targetVisible = !s.visible; }
        });
        charts.forEach(ch => {
          const s = ch.series.find(sr => sr.name === name);
          if (s) s.setVisible(targetVisible, false);
        });
        charts.forEach(ch => ch.redraw());
        div.classList.toggle('off', !targetVisible);
      });

      el.appendChild(div);
    });
  }
  buildGlobalLegend('global-legend', [chSteps, chAPS, chNZE]);
});
</script>
</body>
</html>
