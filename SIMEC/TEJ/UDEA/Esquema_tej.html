<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Transición Energética Justa – Esquema Vertical</title>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <style>
    body { margin:0; padding:0; font-family:'Segoe UI', sans-serif; }
    #container { width:80%; height:600px; margin: auto; }
    .highlight { filter: drop-shadow(0 0 6px #00ff00); }
  </style>
</head>
<body>

  <div id="container"></div>

  <script>
  Highcharts.chart('container', {
    chart: {
      backgroundColor: '#fff',
      animation: false,
      events: {
        load: function() {
          const chart = this,
                r     = chart.renderer,
                W     = chart.chartWidth,
                H     = chart.chartHeight;

          // Coordenadas verticales
          const xs       = [0.2, 0.5, 0.8].map(f => W * f),
                yRoot    = H * 0.10,
                yParent  = H * 0.30,
                yChildren= H * 0.70;

          // Dimensiones de nodos
          const dims = {
            raiz:       { w:140, h:56,  fill:'#fafafa' },
            principios: { w:128, h:48,  fill:'#83FF57' },
            principal:  { w:208, h:48,  fill:'#83FF57' },
            subprin:    { w:208, h:24,  fill:'#D4FF88' },
            subtema:    { w:208, h:24,  fill:'#F1FFC1' },
            subtemaP:   { w:208, h:24,  fill:'#F1FFC1' }
          };

          // Textos de tooltip
          const tooltipTexts = {
            principios: '4 Principios propuestos en la Hoja de Ruta de la TEJ',
            justicia:   'Justicia Ambiental, climática y energética.',
            politicas:  'Políticas de gobierno: acción climática, regulación…',
            sub0: 'Equidad: distribución justa de cargas y beneficios.',
            sub1: 'Gradualidad: paso a paso con confiabilidad.',
            sub2: 'Participación vinculante de las comunidades.',
            sub3: 'Intensiva en conocimiento y transferencia técnica.',
            jt0: '¿Cómo y quién decide?',
            jt1: 'Distribución de cargas y beneficios',
            jt2: 'Reconocimiento de otros saberes',
            jt3: 'Restauración',
            pt0: 'Acción climática y descarbonización',
            pt1: 'Reindustrialización y diversificación productiva',
            pt2: 'Enfoque diferencial, DDHH y Paz Total',
            pt3: 'Democratización energética'
          };

          // Función para crear nodos
          function makeNode(id, text, cx, cy, { w, h, fill }) {
            const x = cx - w/2, y = cy - h/2, g = r.g().add();
            const radius = id==='raiz' ? h/2 : 6;
            const rect = r.rect(x,y,w,h,radius)
                          .attr({ fill, stroke:'limegreen','stroke-width':2 })
                          .add(g);
            // tooltips
            if (tooltipTexts[id]) {
              rect.element.addEventListener('mouseenter', e=>{
                tooltipDiv.innerHTML = tooltipTexts[id];
                tooltipDiv.style.display = 'block';
                tooltipDiv.style.left = e.pageX + 10 + 'px';
                tooltipDiv.style.top  = e.pageY + 10 + 'px';
              });
              rect.element.addEventListener('mousemove', e=>{
                tooltipDiv.style.left = e.pageX + 10 + 'px';
                tooltipDiv.style.top  = e.pageY + 10 + 'px';
              });
              rect.element.addEventListener('mouseleave', ()=> tooltipDiv.style.display='none');
            }
            // texto multilínea para 'justicia'
            const fs = (h>40?10:9) + 'px';
            if (id==='justicia') {
              const gap=2, totalH=2*parseInt(fs)+gap,
                    startY=cy-totalH/2+parseInt(fs)/2+5;
              r.text('Justicia Ambiental, climática y',cx,startY)
               .css({ fontSize:fs, textAlign:'center' })
               .attr({ align:'center' }).add(g);
              r.text('energética',cx,startY+parseInt(fs)+gap)
               .css({ fontSize:fs, textAlign:'center' })
               .attr({ align:'center' }).add(g);
            } else {
              r.text(text, cx, cy)
               .css({ fontSize:fs, textAlign:'center',
                      fontWeight:id==='raiz'?'bold':'normal' })
               .attr({ align:'center', y:cy+parseInt(fs)/2-2 }).add(g);
            }
            g.on('mouseover',()=>g.addClass('highlight'))
             .on('mouseout', ()=>g.removeClass('highlight'));
            return { id,x,y,w,h,cx,cy };
          }

          // Contenedor de tooltip
          const tooltipDiv = document.createElement('div');
          Object.assign(tooltipDiv.style, {
            position: 'absolute', pointerEvents: 'none',
            background: 'rgba(255,255,255,0.95)', border: '1px solid #666',
            borderRadius: '4px', padding: '8px', maxWidth: '200px',
            fontSize: '11px', boxShadow: '0 2px 6px rgba(0,0,0,0.2)',
            display: 'none', zIndex: 1000
          });
          chart.renderTo.parentNode.appendChild(tooltipDiv);

          // 1) Nodo raíz y nodos de segundo nivel
          const nodoRoot = makeNode('raiz','Transición Energética Justa', xs[1], yRoot, dims.raiz);
          const nodoPrin = makeNode('principios','Principios de la TEJ',      xs[1], yParent, dims.principios);
          const nodoPoli = makeNode('politicas','Políticas de gobierno',     xs[0], yParent, dims.principal);
          const nodoJust = makeNode('justicia','Justicia Ambiental, climática y energética', xs[2], yParent, dims.principal);

          // 2) Conexiones curvas raíz → cada uno de los tres padres
          [{to:nodoPrin},{to:nodoPoli},{to:nodoJust}].forEach(obj=>{
            const p = obj.to;
            const x1 = nodoRoot.cx,      y1 = nodoRoot.cy + nodoRoot.h/2;
            const x2 = p.cx,             y2 = p.cy - p.h/2;
            const midY = (y1 + y2) / 2;
            r.path(['M',x1,y1,'L',x1,midY,'L',x2,midY,'L',x2,y2])
             .attr({ stroke:'limegreen','stroke-width':2 }).add();
          });

          // 3) Subprincipios (bajo "Principios de la TEJ"), distribuidos horizontalmente
          const subsLabels = [
            '1. Equidad',
            '2. Gradualidad, soberanía y confiabilidad',
            '3. Participación social vinculante',
            '4. Intensiva en conocimiento'
          ];
          const dx = dims.subprin.w * 1.2;
          const startX = nodoPrin.cx - dx*(subsLabels.length-1)/2;
          subsLabels.forEach((label,i)=>{
            const cx = startX + dx*i, cy = yChildren;
            const n = makeNode('sub'+i, label, cx, cy, dims.subprin);
            // líneas en L
            r.path([
              'M', nodoPrin.cx, nodoPrin.cy + nodoPrin.h/2,
              'L', nodoPrin.cx, cy - dims.subprin.h/2 - 10,
              'L', cx,      cy - dims.subprin.h/2 - 10,
              'L', cx,      cy - dims.subprin.h/2
            ]).attr({ stroke:'limegreen','stroke-width':1.2 }).add();
            r.circle(n.x, n.cy, 4).attr({ fill:'limegreen',stroke:'none' }).add();
          });

          // 4) Subtemas de Justicia (bajo "Justicia...")
          const jtLabels = [
            '¿Cómo y quién decide?',
            'Distribución de cargas y beneficios',
            'Reconocimiento de otros saberes',
            'Restauración'
          ];
          const dxJ = dims.subtema.w * 1.2;
          const startXJ = nodoJust.cx - dxJ*(jtLabels.length-1)/2;
          jtLabels.forEach((t,i)=>{
            const cx = startXJ + dxJ*i, cy = yChildren;
            const n = makeNode('jt'+i, t, cx, cy, dims.subtema);
            r.path([
              'M', nodoJust.cx, nodoJust.cy + nodoJust.h/2,
              'L', nodoJust.cx, cy - dims.subtema.h/2 - 10,
              'L', cx,      cy - dims.subtema.h/2 - 10,
              'L', cx,      cy - dims.subtema.h/2
            ]).attr({ stroke:'limegreen','stroke-width':1.2 }).add();
            r.circle(n.x, n.cy, 4).attr({ fill:'limegreen',stroke:'none' }).add();
          });

          // 5) Subtemas de Políticas (bajo "Políticas de gobierno")
          const ptLabels = [
            'Acción climática y descarbonización',
            'Reindustrialización y diversificación productiva',
            'Enfoque diferencial, DDHH y Paz Total',
            'Democratización energética'
          ];
          const dxP = dims.subtemaP.w * 1.2;
          const startXP = nodoPoli.cx - dxP*(ptLabels.length-1)/2;
          ptLabels.forEach((t,i)=>{
            const cx = startXP + dxP*i, cy = yChildren;
            const n = makeNode('pt'+i, t, cx, cy, dims.subtemaP);
            r.path([
              'M', nodoPoli.cx, nodoPoli.cy + nodoPoli.h/2,
              'L', nodoPoli.cx, cy - dims.subtemaP.h/2 - 10,
              'L', cx,      cy - dims.subtemaP.h/2 - 10,
              'L', cx,      cy - dims.subtemaP.h/2
            ]).attr({ stroke:'limegreen','stroke-width':1.2 }).add();
            r.circle(n.x,n.cy,4).attr({ fill:'limegreen',stroke:'none' }).add();
          });

          // 6) Esferas huecas alrededor de los tres padres
          [nodoPrin, nodoPoli, nodoJust].forEach(nd=>{
            r.circle(nd.cx, nd.cy, nd.h/2 - 12)
             .attr({ fill:'#fff', stroke:'limegreen', 'stroke-width':4 })
             .add().toFront();
          });

        } // load
      }   // events
    },
    title: { text: '' },
    tooltip: { enabled: false },
    series: []
  });
  </script>

</body>
</html>
