<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Timeline – Hitos TEJ</title>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/modules/timeline.js"></script>
  <style>
    #container {
      width: 96%;
      max-width: 1300px;   /* más ancho para 10 cuadros */
      height: 420px;
      margin: 40px auto;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    Highcharts.chart('container', {
      chart: { type: 'timeline' },
      title: { text: 'Acuerdos globales sobre el Cambio Climático' },
      credits: { enabled: false },
      xAxis: { visible: false },
      yAxis: { visible: false },

      // 10 tonos de verde (uno por cuadro)
      colors: [
        '#b0fdb0', '#9af89a', '#84f384', '#6eed6e', '#58e858',
        '#41e241', '#2bdc2b', '#18c918', '#0fb20f', '#079a07'
      ],

      series: [{
  type: 'timeline',
  data: [
    {
      name: 'Informe Brundtland',
      label: '<strong>1987',
      description: 'Estableció por primera vez el concepto de desarrollo sostenible, uniendo el progreso económico, la equidad social y la protección ambiental para el bienestar presente y futuro.'
    },
    {
      name: 'Protocolo de Montreal',
      label: '<strong>1987',
      description: 'Acuerdo internacional diseñado para proteger la capa de ozono mediante la eliminación progresiva de las sustancias químicas que la destruyen.'
    },
    {
      name: 'Creación IPCC',
      label: '<strong>1988',
      description: 'Creación del Grupo Intergubernamental de Expertos sobre el Cambio Climático para evaluar de forma objetiva la información científica y asesorar a los gobiernos.'
    },
    {
      name: 'Cumbre de Río de Janeiro',
      label: '<strong>1992',
      description: 'Conocida como la Cumbre de la Tierra, estableció un plan de acción global para el desarrollo sostenible, abordando una amplia gama de temas ambientales y de desarrollo.'
    },
    {
      name: 'Protocolo de Kyoto',
      label: '<strong>1997',
      description: 'Fue el primer acuerdo internacional que estableció objetivos legalmente vinculantes para que los países industrializados redujeran sus emisiones de gases de efecto invernadero.'
    },
    {
      name: 'Cumbre de Johannesburgo',
      label: '<strong>2002',
      description: 'Reafirmó los compromisos globales con el desarrollo sostenible y evaluó los avances realizados diez años después de la Cumbre de la Tierra.'
    },
    {
      name: 'Acuerdo de Copenhague',
      label: '<strong>2009',
      description: 'Acuerdo no vinculante que reconoció formalmente la necesidad de limitar el calentamiento global a un máximo de 2°C, aunque sin establecer compromisos obligatorios.'
    },
    {
      name: 'Acuerdos de Cancún',
      label: '<strong>2010',
      description: 'Estableció una serie de mecanismos y fondos, como el Fondo Verde para el Clima, para ayudar a los países en desarrollo a mitigar el cambio climático y adaptarse a sus efectos.'
    },
    {
      name: 'Acuerdos de París',
      label: '<strong>2016',
      description: 'Acuerdo histórico que busca limitar el calentamiento global muy por debajo de los 2°C (preferiblemente a 1.5°C) mediante compromisos nacionales de reducción de emisiones presentados por cada país.'
    },
    {
      name: 'COP26 (Glasgow)',
      label: '<strong>2021',
      description: 'Cumbre que se centró en aumentar la ambición para cumplir las metas de París, finalizando su reglamento y logrando acuerdos clave sobre la reducción del uso del carbón y las emisiones de metano.'
    }
  ]
}]

    });
  </script>
</body>
</html>
