// === Animación por trazo (sin efecto en columnas, se deja igual) ===
const DURACION_TOTAL_MS = years.length * 130; // ~ igual a tu cadencia original

function animarPorTrazo() {
  chart.series.forEach(s => {
    const g = s.graph && s.graph.element;
    if (!g || !g.getTotalLength) return;

    g.style.transition = 'none';
    g.style.strokeDasharray = '';
    g.style.strokeDashoffset = '';
    void g.getBoundingClientRect();

    const len = g.getTotalLength();
    g.style.strokeDasharray = `${len} ${len}`;
    g.style.strokeDashoffset = `${len}`;

    const onEnd = () => {
      g.style.transition = '';
      g.style.strokeDasharray = '';
      g.style.strokeDashoffset = '';
      g.removeEventListener('transitionend', onEnd);
    };
    g.addEventListener('transitionend', onEnd);

    requestAnimationFrame(() => {
      g.style.transition = `stroke-dashoffset ${DURACION_TOTAL_MS}ms linear`;
      g.style.strokeDashoffset = '0';
    });
  });
}

// Salvaguarda por si no existe el botón en el HTML copiado
const btnPlay = document.getElementById('play');
if (btnPlay) btnPlay.addEventListener('click', animarPorTrazo);
