<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Emisiones netas 2021 por módulo (ktCO₂e)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/modules/exporting.js"></script>
  <script src="https://code.highcharts.com/modules/export-data.js"></script>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
    #wrap{max-width:1000px;margin:24px auto;padding:0 12px;}
    #chart{height:520px;}
  </style>
</head>
<body>
<div id="wrap"><div id="chart"></div></div>

<script>
// Locale ES
Highcharts.setOptions({ lang: {
  decimalPoint: ',', thousandsSep: '.',
  downloadCSV: 'Download CSV', downloadXLS: 'Download XLS',
  viewData: 'View data table'
}});

// Datos (ktCO₂e) tomados de la tabla de la imagen
const datos = [
  { name: 'Silvicultura, uso y cambio de uso de la tierra', y: 96603.06, color: '#deed1b' },
  { name: 'Energía',                                         y: 91610.54, color: '#ecb000' },
  { name: 'Agricultura',                                     y: 57957.85, color: '#05d80a' },
  { name: 'Residuos',                                        y: 22209.05, color: '#183e34' },
  { name: 'Procesos industriales',                           y: 11721.47, color: '#deff64' }
];
// Comprobación rápida del total (opcional)
const total = datos.reduce((s,p)=>s+p.y,0); // 280101.97

Highcharts.chart('chart', {
  chart: { type: 'pie' },
  title: {
    text: 'Emisiones netas - 2021 por módulo',
    style: { color:'#000', fontWeight:700 }
  },
  subtitle: { text: 'Fuente: Adaptado de (IDEAM, 2024). Nota: porcentajes respecto al total (280.101,97 ktCO₂e).' },
  credits: { enabled:false },

  exporting: {
    enabled: true,
    buttons: {
      contextButton: {
        menuItems: [
          'downloadPNG', 'downloadPDF', 'separator',
          'downloadCSV', 'downloadXLS', 'viewData'
        ]
      }
    }
  },

  tooltip: {
    useHTML: true,
    pointFormat:
      '<b>{point.percentage:.0f}%</b><br/>' +
      '{point.y:,.2f} ktCO\u2082e'
  },

  plotOptions: {
    pie: {
      innerSize: '58%',              // donut
      borderWidth: 0.2,
      dataLabels: {
        enabled: true,
        distance: 1,
        style: { fontWeight: 600, textOutline: 'none', color: '#4a4a4a' },
        formatter: function () {
          return this.point.name + '<br/><span style="font-weight:700">'
                 + Highcharts.numberFormat(this.point.percentage, 0) + '%</span>';
        }
      },
      showInLegend: false
    }
  },

  series: [{
    name: 'Emisiones 2021',
    data: datos,
    colorByPoint: true
  }]
});
</script>
</body>
</html>
