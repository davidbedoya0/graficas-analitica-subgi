<!DOCTYPE html>
<html>
<head>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
</head>
<body>
    <div id="container" style="width: 100%; height: 600px;"></div>
    <script>
        Highcharts.chart('container', {
            chart: {
                type: 'column',
                backgroundColor: '#ffffff'
            },
            title: {
                text: 'Casos de conflictos sociales en el sector minero energetíco 2000 - 2023'
            },
            subtitle: {
                    text: 'Fuente: PARES',
                    align: 'left'
            },
            legend: {
                enabled: false
        
            },
            xAxis: {
                categories: [1980, 1985, 1989, 1992, 1994, 1995, 1998, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023],
                labels: {
                    style: {
                        fontSize: '14px'
                    }
                }
            },
            yAxis: {
                title: {
                    text: 'No. de casos',
                    style: {
                        fontWeight: 'bold',
                        fontSize: '14px'
                    }
                },
                gridLineDashStyle: 'Dash'
            },
            
            tooltip: {
                shared: true
            },
            plotOptions: {
                column: {
            dataLabels: {
                enabled: false
            },
        }
    },
            series: [
                {data: [1, 1, 1, 3, 1, 1, 1, 3, 5, 5, 2, 3, 3, 1, 5, 13, 10, 12, 13, 3, 6, 2, 2, 3, 4, 1, 1, 1, 3, 9, 7],
                color: '#b8ff65'},

            ],
        });
    </script>
</body>
</html>
